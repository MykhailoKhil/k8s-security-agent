# Read-only identity for the audit agent. No write verbs, no Secrets access.
apiVersion: v1
kind: Namespace
metadata: {name: security-audit}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: auditor, namespace: security-audit}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: auditor-extra-read}
rules:
- apiGroups: [""]
  resources: [nodes, namespaces, persistentvolumes, componentstatuses]
  verbs: [get, list]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [roles, rolebindings, clusterroles, clusterrolebindings]
  verbs: [get, list]
- apiGroups: [apiextensions.k8s.io]
  resources: [customresourcedefinitions]
  verbs: [get, list]
- apiGroups: [argoproj.io]
  resources: [applications, appprojects, applicationsets]
  verbs: [get, list]
- apiGroups: [admissionregistration.k8s.io]
  resources: [validatingwebhookconfigurations, mutatingwebhookconfigurations, validatingadmissionpolicies, validatingadmissionpolicybindings]
  verbs: [get, list]
- apiGroups: [storage.k8s.io]
  resources: [storageclasses]
  verbs: [get, list]
- apiGroups: [certificates.k8s.io]
  resources: [certificatesigningrequests]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: auditor-view}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects: [{kind: ServiceAccount, name: auditor, namespace: security-audit}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: auditor-extra-read}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: auditor-extra-read}
subjects: [{kind: ServiceAccount, name: auditor, namespace: security-audit}]

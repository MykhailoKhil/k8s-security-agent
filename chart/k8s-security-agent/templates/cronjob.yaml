apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}
  labels: {app.kubernetes.io/name: k8s-security-agent}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: {{ .Values.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      backoffLimit: 0
      template:
        metadata:
          labels: {app.kubernetes.io/name: k8s-security-agent}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false     # the agent uses the kubeconfig below, not this pod's identity
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: agent
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              env:
                - name: OUT_DIR
                  value: /out
                - name: HOME
                  value: /home/agent
                {{- range $k, $v := .Values.env }}
                {{- if $v }}
                - name: {{ $k }}
                  value: {{ $v | quote }}
                {{- end }}
                {{- end }}
                - name: ANTHROPIC_API_KEY
                  valueFrom:
                    secretKeyRef: {name: {{ .Values.anthropicApiKeySecret.name }}, key: {{ .Values.anthropicApiKeySecret.key }}}
                {{- if .Values.gitTokenSecret.name }}
                - name: GIT_TOKEN
                  valueFrom:
                    secretKeyRef: {name: {{ .Values.gitTokenSecret.name }}, key: {{ .Values.gitTokenSecret.key }}}
                {{- end }}
                {{- if .Values.kubeconfigSecret.name }}
                - name: KUBECONFIG
                  value: /kube/{{ .Values.kubeconfigSecret.key }}
                {{- end }}
              resources: {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - {name: out, mountPath: /out}
                - {name: home, mountPath: /home/agent}
                - {name: tmp, mountPath: /tmp}
                {{- if .Values.kubeconfigSecret.name }}
                - {name: kubeconfig, mountPath: /kube, readOnly: true}
                {{- end }}
          volumes:
            - name: out
              {{- if .Values.persistence.enabled }}
              persistentVolumeClaim: {claimName: {{ .Release.Name }}-reports}
              {{- else }}
              emptyDir: {}
              {{- end }}
            - {name: home, emptyDir: {}}
            - {name: tmp, emptyDir: {}}
            {{- if .Values.kubeconfigSecret.name }}
            - name: kubeconfig
              secret: {secretName: {{ .Values.kubeconfigSecret.name }}, defaultMode: 0400}
            {{- end }}

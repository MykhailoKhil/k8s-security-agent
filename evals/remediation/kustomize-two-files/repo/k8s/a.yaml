apiVersion: apps/v1
kind: Deployment
metadata:
  name: a
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: a
  template:
    metadata:
      labels:
        app: a
    spec:
      containers:
        - name: a
          image: nginx:1.27.1
          ports:
            - containerPort: 8080
          env:
            - name: MODE
              value: prod

apiVersion: apps/v1
kind: Deployment
metadata:
  name: b
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: b
  template:
    metadata:
      labels:
        app: b
    spec:
      containers:
        - name: b
          image: nginx:1.27.1
          ports:
            - containerPort: 8080
          env:
            - name: MODE
              value: prod
